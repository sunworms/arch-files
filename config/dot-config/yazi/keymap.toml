[[mgr.prepend_keymap]]
desc = "Select device then mount"
on = ["M", "m"]
run = "plugin gvfs -- select-then-mount"

[[mgr.prepend_keymap]]
desc = "Select device, mount, and jump"
on = ["M", "J"]
run = "plugin gvfs -- select-then-mount --jump"

[[mgr.prepend_keymap]]
desc = "Remount device under cwd"
on = ["M", "R"]
run = "plugin gvfs -- remount-current-cwd-device"

[[mgr.prepend_keymap]]
desc = "Select device then unmount"
on = ["M", "u"]
run = "plugin gvfs -- select-then-unmount"

[[mgr.prepend_keymap]]
desc = "Select device then eject"
on = ["M", "e"]
run = "plugin gvfs -- select-then-unmount --eject"

[[mgr.prepend_keymap]]
desc = "Force eject/unmount"
on = ["M", "E"]
run = "plugin gvfs -- select-then-unmount --eject --force"

[[mgr.prepend_keymap]]
desc = "Add a GVFS mount URI"
on = ["M", "a"]
run = "plugin gvfs -- add-mount"

[[mgr.prepend_keymap]]
desc = "Edit a GVFS mount URI"
on = ["M", "v", "e"]
run = "plugin gvfs -- edit-mount"

[[mgr.prepend_keymap]]
desc = "Remove a GVFS mount URI"
on = ["M", "v", "r"]
run = "plugin gvfs -- remove-mount"

[[mgr.prepend_keymap]]
desc = "Select device then jump to mount point"
on = ["g", "m"]
run = "plugin gvfs -- jump-to-device"

[[mgr.prepend_keymap]]
desc = "Automount then jump to mount point"
on = ["g", "M"]
run = "plugin gvfs -- jump-to-device --automount"

[[mgr.prepend_keymap]]
desc = "Jump back to previous position"
on = ["`", "`"]
run = "plugin gvfs -- jump-back-prev-cwd"

[[mgr.prepend_keymap]]
desc = "Enable automount on cd"
on = ["M", "t"]
run = "plugin gvfs -- automount-when-cd"

[[mgr.prepend_keymap]]
desc = "Disable automount on cd"
on = ["M", "T"]
run = "plugin gvfs -- automount-when-cd --disabled"

[[mgr.prepend_keymap]]
desc = "Copy file URL"
on = ["c", "C"]
run = 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list'

[[mgr.prepend_keymap]]
desc = "Copy directory URL"
on = ["c", "D"]
run = 'shell -- for path in %s; do echo "file://$(dirname "$path")"; done | wl-copy -t text/uri-list'

[[mgr.prepend_keymap]]
desc = "Yank file in Yazi and system clipboard"
on = ["c", "y"]
run = ["yank", 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list']

[[mgr.prepend_keymap]]
desc = "Cut file in Yazi and system clipboard"
on = ["c", "x"]
run = ["yank --cut", 'shell -- for path in %s; do echo "file://$path"; done | wl-copy -t text/uri-list']

[[mgr.prepend_keymap]]
desc = "yafg"
on = ["F", "G"]
run = "plugin yafg"

[[mgr.prepend_keymap]]
desc = "Chmod on selected files"
on = ["c", "m"]
run = "plugin chmod"

[[mgr.prepend_keymap]]
desc = "Drag Files"
on = ["<C-d>"]
run = "plugin drag"

[[mgr.prepend_keymap]]
desc = "Mount manager"
on = ["m"]
run = "plugin mount"
