[include]
files = []

[include.optional]
files = ["noctalia.toml"]

[general]
autostart = [
  "noctalia",
  "kanata --cfg ~/.config/kanata/config.kbd",
]
show_cheatsheet = false
focus_on_activate = true

[environment]
GTK_USE_PORTAL = "1"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
QT_AUTO_SCREEN_SCALE_FACTOR = "1"
QT_QPA_PLATFORMTHEME = "qt6ct"
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"
TERMINAL = "foot"
_JAVA_AWT_WM_NONREPARENTING = "1"

[events]
lid_close = "noctalia msg session lock-and-suspend"

[output.eDP-1]
scale = 1.8
hdr = "auto"

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 6

[appearance.blur]
enabled = true
passes = 3
radius = 3
noise = 0.02
saturation = 1.5

[appearance.shadow]
enabled = true
softness = 20
offset_x = 0
offset_y = 5

[input.keyboard]
numlock_toggle = true

[input.touchpad]
tap = true
natural_scroll = true

[input.cursor]
theme = "volantes_cursors"
size = 24

[layout]
mode = "scrolling"
gap = 0
extent_presets = [0.5, 0.75, 1.0]

[layout.struts]
left = 15
right = 15
top = 15
bottom = 15

[layout.scrolling]
default_extent_fraction = 1.0
center_focused = "never"

[overview]
zoom = 0.15

[hot_corners.top_left]
enabled = false

[keybinds]

"Mod+T" = { action = "spawn foot", repeat = false }
"Mod+A" = "spawn noctalia msg panel-toggle launcher"
"Mod+V" = "spawn noctalia msg panel-toggle clipboard"
"Mod+Escape" = "spawn noctalia msg panel-toggle session"
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Space" = { action = "overview-toggle", repeat = false }
"Mod+Shift+Slash" = "cheatsheet-open"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Ctrl+Alt+Delete" = "session-quit"
"Mod+Shift+P" = "dpms-off"

"Alt+Tab" = "spawn noctalia msg window-switcher hold"
"Alt+Shift+Tab" = "spawn noctalia msg window-switcher hold reverse"
"Mod+Tab" = "spawn noctalia msg window-switcher hold"
"Mod+Shift+Tab" = "spawn noctalia msg window-switcher hold reverse"

"Print" = "spawn noctalia msg screenshot-region"
"Ctrl+Print" = "spawn noctalia msg screenshot-fullscreen all"
"Alt+Print" = "spawn noctalia msg screenshot-window"
"Super+Shift+S" = "spawn noctalia msg screenshot-region"
"Ctrl+Super+Shift+S" = "spawn noctalia msg screenshot-fullscreen all"
"Alt+Super+Shift+S" = "spawn noctalia msg screenshot-window"
"Mod+Print" = 'spawn sh -c "wl-paste --type image | satty --fullscreen --filename -"'
"Ctrl+Alt+Super+Shift+S" = 'spawn sh -c "wl-paste --type image | satty --fullscreen --filename -"'

"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up 5", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down 5", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up 5", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down 5", allow_when_locked = true }
"XF86Calculator" = "spawn noctalia msg panel-toggle control-center calendar"
"XF86Favorites" = "spawn noctalia msg panel-toggle launcher /emo"
"XF86Launch5" = "spawn noctalia msg session lock"
"XF86Launch6" = "spawn noctalia msg window-switcher"
"XF86PowerOff" = "spawn noctalia msg session lock-and-suspend"
"XF86Tools" = "spawn noctalia msg settings-toggle"

"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+J" = "window-focus-or-workspace-down"
"Mod+K" = "window-focus-or-workspace-up"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+Shift+V" = "window-focus-switch-floating"

"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+L" = "column-move-right"
"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Ctrl+J" = "window-move-or-workspace-down"
"Mod+Ctrl+K" = "window-move-or-workspace-up"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

"Mod+C" = "column-center"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+V" = "window-toggle-floating"
"Mod+F" = "window-toggle-maximize"
"Mod+M" = "window-toggle-maximize-to-edges"
"Mod+Shift+F" = "window-toggle-fullscreen"

"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+Comma" = "window-consume-from-right"
"Mod+Period" = "window-consume-or-expel-right"

"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-secondary-extent"
"Mod+Equal" = "window-modify-primary-extent +0.05"
"Mod+Minus" = "window-modify-primary-extent -0.05"
"Mod+Shift+Equal" = "window-modify-secondary-extent +0.05"
"Mod+Shift+Minus" = "window-modify-secondary-extent -0.05"

"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+0" = "workspace-switch 10"

"Mod+Ctrl+1" = "column-move-to-workspace 1"
"Mod+Ctrl+2" = "column-move-to-workspace 2"
"Mod+Ctrl+3" = "column-move-to-workspace 3"
"Mod+Ctrl+4" = "column-move-to-workspace 4"
"Mod+Ctrl+5" = "column-move-to-workspace 5"
"Mod+Ctrl+6" = "column-move-to-workspace 6"
"Mod+Ctrl+7" = "column-move-to-workspace 7"
"Mod+Ctrl+8" = "column-move-to-workspace 8"
"Mod+Ctrl+9" = "column-move-to-workspace 9"
"Mod+Ctrl+0" = "column-move-to-workspace 10"

"Mod+I" = "workspace-previous"
"Mod+U" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+Page_Down" = "workspace-next"

"Mod+Ctrl+I" = "column-move-to-workspace-previous"
"Mod+Ctrl+U" = "column-move-to-workspace-next"
"Mod+Ctrl+Page_Up" = "column-move-to-workspace-previous"
"Mod+Ctrl+Page_Down" = "column-move-to-workspace-next"

"Mod+Shift+I" = "workspace-move-up"
"Mod+Shift+U" = "workspace-move-down"
"Mod+Shift+Page_Up" = "workspace-move-up"
"Mod+Shift+Page_Down" = "workspace-move-down"

"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Shift+H" = "output-focus-left"
"Mod+Shift+L" = "output-focus-right"
"Mod+Shift+K" = "output-focus-up"
"Mod+Shift+J" = "output-focus-down"

"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+H" = "column-move-to-output-left"
"Mod+Shift+Ctrl+L" = "column-move-to-output-right"
"Mod+Shift+Ctrl+K" = "column-move-to-output-up"
"Mod+Shift+Ctrl+J" = "column-move-to-output-down"

"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+WheelLeft" = "window-focus-left"
"Mod+WheelRight" = "window-focus-right"

"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "window-focus-left"

"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelLeft" = "column-move-left"
"Mod+Ctrl+WheelRight" = "column-move-right"
"Mod+Ctrl+Shift+WheelDown" = "column-move-right"
"Mod+Ctrl+Shift+WheelUp" = "column-move-left"

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_floating_size_px = { width = 525, height = 295 }
default_position = { x = 950, y = 225, anchor = "top_left" }
default_pinned = true

[[window_rule]]
match.app_id = "^org.gnome.Nautilus$"
match.title = ".*Files?"
default_floating = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1000, height = 750 }
blur = true

[[window_rule]]
match.app_id = ["^xdg_filechooser$", "^dev.noctalia.UmbrielSharePicker$"]
default_floating = true
default_floating_size_px = { width = 900, height = 600 }
blur = true

[[window_rule]]
match.app_id = ["^org.pwmt.zathura$", "^foot$", "^emacs$", "^Emacs$"]
blur = true

[[window_rule]]
match.title = ".+?is sharing a window.$"
default_floating = true
default_position = { x = 3000, y = 2000, anchor = "top_left" }

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = true
