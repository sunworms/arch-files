---
# roles/dotfiles/tasks/main.yml
# Bootstraps chezmoi and applies the dotfiles source directory.
# chezmoi itself is installed via the packages role (add it to aur_packages
# or pacman_packages — it's in the community repo).

- name: Ensure chezmoi is installed
  community.general.pacman:
    name: chezmoi
    state: present
  become: true

# chezmoi --source lets you point at any directory — including a subdirectory
# of this repo — without cloning or copying anything.
# chezmoi_source_dir defaults to "{{ playbook_dir }}/chezmoi" in group_vars,
# so if your dotfiles live at the root of this repo just set it to
# "{{ playbook_dir }}" instead.
- name: Apply chezmoi dotfiles from local source directory
  ansible.builtin.shell: |
    set -e
    chezmoi apply --force --source {{ chezmoi_source_dir }}
    chezmoi init
  become: true
  become_user: "{{ arch_user }}"
  changed_when: true

# Deploy .face (the avatar image) — not a dotfile, so handled directly
- name: Deploy user .face image
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/face"
    dest: "{{ arch_home }}/.face"
    owner: "{{ arch_user }}"
    group: "{{ arch_user }}"
    mode: "0644"
  become: true
