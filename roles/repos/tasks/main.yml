---
# roles/repos/tasks/main.yml
# Adds CachyOS and Chaotic-AUR repositories to /etc/pacman.conf.
# Mirrors the logic from scripts/setup-repos.sh but idempotently.

- name: Check if CachyOS repos are already in pacman.conf
  ansible.builtin.command: grep -q '\[cachyos\]' /etc/pacman.conf
  register: cachyos_present
  changed_when: false
  failed_when: false
  become: true

- name: Download and run CachyOS repo installer
  when: cachyos_present.rc != 0
  become: true
  block:
    - name: Create temp working directory
      ansible.builtin.tempfile:
        state: directory
        suffix: cachyos
      register: cachyos_tmpdir

    - name: Download CachyOS repo tarball
      ansible.builtin.get_url:
        url: https://mirror.cachyos.org/cachyos-repo.tar.xz
        dest: "{{ cachyos_tmpdir.path }}/cachyos-repo.tar.xz"
        mode: "0644"

    - name: Extract tarball
      ansible.builtin.unarchive:
        src: "{{ cachyos_tmpdir.path }}/cachyos-repo.tar.xz"
        dest: "{{ cachyos_tmpdir.path }}"
        remote_src: true

    - name: Run CachyOS installer
      ansible.builtin.shell:
        cmd: bash cachyos-repo.sh
        chdir: "{{ cachyos_tmpdir.path }}/cachyos-repo"
      environment:
        # Suppress interactive prompts where possible
        TERM: dumb

    - name: Clean up temp directory
      ansible.builtin.file:
        path: "{{ cachyos_tmpdir.path }}"
        state: absent

- name: Check if Chaotic-AUR is already in pacman.conf
  ansible.builtin.command: grep -q '\[chaotic-aur\]' /etc/pacman.conf
  register: chaotic_present
  changed_when: false
  failed_when: false
  become: true

- name: Set up Chaotic-AUR
  when: chaotic_present.rc != 0
  become: true
  block:
    - name: Import Chaotic-AUR primary key
      ansible.builtin.command: >
        pacman-key --recv-keys 3056513887B78AEB
        --keyserver keyserver.ubuntu.com
      changed_when: true

    - name: Locally sign Chaotic-AUR key
      ansible.builtin.command: pacman-key --lsign-key 3056513887B78AEB
      changed_when: true

    - name: Install chaotic-keyring
      ansible.builtin.command: >
        pacman -U --noconfirm
        https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst
      changed_when: true

    - name: Install chaotic-mirrorlist
      ansible.builtin.command: >
        pacman -U --noconfirm
        https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst
      changed_when: true

    - name: Append [chaotic-aur] block to pacman.conf
      ansible.builtin.blockinfile:
        path: /etc/pacman.conf
        marker: "# {mark} ANSIBLE MANAGED — Chaotic-AUR"
        block: |
          [chaotic-aur]
          Include = /etc/pacman.d/chaotic-mirrorlist

- name: Sync package databases
  community.general.pacman:
    update_cache: true
  become: true
