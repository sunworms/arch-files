---
# Main playbook — run against localhost after a fresh Arch install
# Usage: ansible-playbook site.yml -K
- name: Arch Linux system setup
  hosts: all
  connection: local
  become: false   # roles that need root escalate individually

  vars_prompt:
    - name: become_password
      prompt: "BECOME password"
      private: true
  vars:
    ansible_become_pass: "{{ become_password }}"
  vars_files:
    - group_vars/all.yml

  roles:
    - { role: repos,     tags: repos }
    - { role: packages,  tags: packages }
    - { role: system,    tags: system }
    - { role: services,  tags: services }
    - { role: bootstrap, tags: bootstrap }
    - { role: dotfiles,  tags: dotfiles }
